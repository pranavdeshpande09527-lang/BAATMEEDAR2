version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baatmeedar-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      # Persist SQLite database outside the container
      # For production with PostgreSQL, remove this volume and update DATABASE_URL
      - ./prisma:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

